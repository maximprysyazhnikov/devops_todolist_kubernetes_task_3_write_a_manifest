apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
  labels:
    app: todoapp
    version: "3.0.0"
spec:
  containers:
  - name: todoapp
    image: maxisky2595/todoapp:3.0.0  # ⚠️ ЗАМІНИТИ {yourname} на ваше ім'я Docker Hub
    ports:
    - containerPort: 8000
      name: http
    env:
    - name: DEBUG
      value: "False"
    - name: ALLOWED_HOSTS
      value: "*"
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    # Readiness probe - checks if app is ready to serve traffic
    readinessProbe:
      httpGet:
        path: /api/health/readiness/
        port: 8000
        scheme: HTTP
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3
    # Liveness probe - checks if app is alive
    livenessProbe:
      httpGet:
        path: /api/health/liveness/
        port: 8000
        scheme: HTTP
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3
  restartPolicy: Always