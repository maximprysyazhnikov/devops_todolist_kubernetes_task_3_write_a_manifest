apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
spec:
  containers:
    - name: todoapp
      image: maxisky2595/kube2py:3.0.0
      ports:
        - containerPort: 8000
      readinessProbe:
        httpGet:
          path: /readiness
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /liveness
          port: 8000
        initialDelaySeconds: 10
        periodSeconds: 15
